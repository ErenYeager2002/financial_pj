[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-skill-platform"
version = "0.1.0"
description = "Department-internal financial Skill registry, orchestrator and executor"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
  "httpx>=0.28,<1",
  "openpyxl>=3.1,<4",
  "pandas>=2.0,<3",
  "xlrd>=2.0,<3",
  "pdfplumber>=0.11,<1",
  "requests>=2.28,<3",
  "playwright>=1.54,<2",
  "cryptography>=45,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "DTZ007"]
