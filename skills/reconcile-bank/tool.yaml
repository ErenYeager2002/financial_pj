schema_version: 1
id: reconcile-bank
name: 银行流水自动对账
version: 1.0.0
status: published
category: 对账核对
description: 对银行流水和财务总账进行确定性匹配，输出匹配明细、未匹配流水和未匹配总账。
ui:
  employee_name: 银行流水自动对账
  short_description: 对银行流水和财务总账进行自动匹配。
  categories: [对账核对]
  estimated_minutes: 3
  output_summary: 匹配明细和待核查清单
  action_label: 开始对账
  popular: true
tags:
  - Excel
  - 银行流水
  - 总账
  - 只读

operational_profile:
  execution_kind: offline_file
  external_sources: []
  employee_labels: [上传两份账表, 本地对账, 输出差异清单]

file_inputs:
  - role: bank_file
    name: 银行流水
    description: 包含交易日期和金额列的 Excel 文件
    required: true
    multiple: false
    extensions: [xlsx]
    max_size_mb: 50
  - role: ledger_file
    name: 财务总账
    description: 包含凭证日期和金额列的 Excel 文件
    required: true
    multiple: false
    extensions: [xlsx]
    max_size_mb: 50

input_schema:
  type: object
  additionalProperties: false
  properties:
    amount_tolerance:
      type: number
      title: 金额容差（元）
      description: 两边金额差不超过该值时允许匹配
      minimum: 0
      maximum: 100
      default: 0.01
    date_tolerance_days:
      type: integer
      title: 日期容差（天）
      description: 两边日期相差不超过该天数时允许匹配
      minimum: 0
      maximum: 31
      default: 1
  required:
    - amount_tolerance
    - date_tolerance_days

output_schema:
  type: object
  required:
    - status
    - summary
    - output_files
    - warnings
  properties:
    status:
      const: success
    summary:
      type: object
      required:
        - bank_records
        - ledger_records
        - matched
        - unmatched_bank
        - unmatched_ledger
    output_files:
      type: array
    warnings:
      type: array

handler:
  adapter: python
  entrypoint: scripts/reconcile.py
  worker_pool: python

runtime:
  timeout_seconds: 300
  memory_mb: 1024
  concurrency_limit: 2
  network_access: false

risk:
  level: read_only
  requires_confirmation: true
  requires_change_review: false
  requires_approval: false
  modifies_uploaded_files: false

safety_constraints:
  amount_tolerance:
    minimum: 0
    maximum: 100
  date_tolerance_days:
    minimum: 0
    maximum: 31

progress_stages:
  - key: reading_files
    label: 正在读取文件
  - key: validating_fields
    label: 正在检查字段
  - key: matching
    label: 正在匹配记录
  - key: generating_output
    label: 正在生成结果文件

result_presentation:
  metrics:
    - key: matched
      label: 成功匹配
    - key: unmatched_bank
      label: 待核查流水
    - key: unmatched_ledger
      label: 待核查总账

permissions:
  run: finance_user
  manage: skill_admin
