schema_version: 1
id: dreame-ar-progress-diff
name: 追觅应收进度对比
version: 1.0.0
status: published
category: 应收管理
description: 对两份及以上追觅应收进度表做期间并集、人名对齐和变化对比。
tags:
- Excel
- 应收
- 多版本对比
- 追觅
file_inputs:
- role: versions
  name: 应收进度版本
  description: 请按旧到新顺序上传至少两份。
  required: true
  multiple: true
  min_files: 2
  extensions:
  - xlsx
  - xlsm
  max_size_mb: 100
input_schema:
  type: object
  additionalProperties: false
  properties: {}
output_schema:
  type: object
  required:
  - status
  - summary
  - output_files
  - warnings
  properties:
    status:
      const: success
    summary:
      type: object
    output_files:
      type: array
    warnings:
      type: array
handler:
  adapter: python
  entrypoint: scripts/entry.py
  worker_pool: python
runtime:
  timeout_seconds: 600
  memory_mb: 2048
  concurrency_limit: 1
  network_access: false
risk:
  level: read_only
  requires_confirmation: false
permissions:
  run: finance_user
  manage: skill_admin
upstream:
  repository: https://github.com/EvanLee2004/finance-skills
  path: skills/dreame-ar-progress-diff
