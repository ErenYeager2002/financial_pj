schema_version: 1
id: dreame-ar-progress-diff
name: 追觅应收进度对比
version: 1.0.0
status: published
category: 应收管理
description: 对两份及以上追觅应收进度表做期间并集、人名对齐和变化对比。
ui:
  employee_name: 追觅应收进度对比
  short_description: 对多个期间的追觅应收进度表进行对齐和变化对比。
  categories: [应收管理]
  estimated_minutes: 3
  output_summary: 应收进度变化对比表
  action_label: 开始对比
  popular: false
tags:
- Excel
- 应收
- 多版本对比
- 追觅
operational_profile:
  execution_kind: offline_file
  external_sources: []
  employee_labels: [上传多个版本, 本地对比, 输出报告]
file_inputs:
- role: versions
  name: 应收进度版本
  description: 请按旧到新顺序上传至少两份。
  required: true
  multiple: true
  min_files: 2
  extensions:
  - xlsx
  - xlsm
  max_size_mb: 100
input_schema:
  type: object
  additionalProperties: false
  properties: {}
output_schema:
  type: object
  required:
  - status
  - summary
  - output_files
  - warnings
  properties:
    status:
      const: success
    summary:
      type: object
    output_files:
      type: array
    warnings:
      type: array
handler:
  adapter: python
  entrypoint: scripts/entry.py
  worker_pool: python
runtime:
  timeout_seconds: 600
  memory_mb: 2048
  concurrency_limit: 1
  network_access: false
risk:
  level: read_only
  requires_confirmation: true
  requires_change_review: false
  requires_approval: false
  modifies_uploaded_files: false
safety_constraints: {}
progress_stages:
- key: reading_files
  label: 正在读取文件
- key: validating_fields
  label: 正在检查字段
- key: processing
  label: 正在对比进度
- key: generating_output
  label: 正在生成结果文件
result_presentation:
  metrics: []
permissions:
  run: finance_user
  manage: skill_admin
upstream:
  repository: https://gitee.com/Lee157/finance-skills.git
  path: skills/dreame-ar-progress-diff
