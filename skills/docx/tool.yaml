schema_version: 1
id: docx
name: Word 基础能力
version: 1.0.0
status: disabled
category: 文档能力
description: Word 文档创建、修订、批注和版面验证的 Agent 基础指南。
tags:
- Word
- 基础能力
operational_profile:
  execution_kind: document_agent
  external_sources: []
  employee_labels: [本地文档, 创建与编辑]
file_inputs: []
input_schema:
  type: object
  additionalProperties: true
  properties: {}
output_schema:
  type: object
  required:
  - status
  - summary
  - output_files
  - warnings
  properties:
    status:
      const: success
    summary:
      type: object
    output_files:
      type: array
    warnings:
      type: array
handler:
  adapter: python
  entrypoint: scripts/entry.py
  worker_pool: python
runtime:
  timeout_seconds: 600
  memory_mb: 2048
  concurrency_limit: 1
  network_access: false
risk:
  level: read_only
  requires_confirmation: false
permissions:
  run: finance_user
  manage: skill_admin
upstream:
  repository: https://gitee.com/Lee157/finance-skills.git
  path: skills/docx
blocked_reason: 基础能力包不是单一业务工具，需要文档型 Agent 运行时。
