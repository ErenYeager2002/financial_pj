  timeout_seconds: 600
  memory_mb: 2048
  concurrency_limit: 1
  network_access: false
risk:
  level: write
  requires_confirmation: true
permissions:
  run: finance_user
  manage: skill_admin
upstream:
  repository: https://github.com/EvanLee2004/finance-skills
  path: skills/ar-hexiao-daily
blocked_reason: 需实现多阶段工作流状态机和写前人工确认，不能包装成一次性脚本。
