ui:
  employee_name: 代扣代缴申报表批量重命名
  short_description: 识别申报表 PDF 内容并生成规范命名的副本，平台不会修改上传原件。
  categories:
  - 文件整理
  estimated_minutes: 1
  output_summary: 规范命名的 PDF 副本
  action_label: 开始整理
  popular: true
tags:
