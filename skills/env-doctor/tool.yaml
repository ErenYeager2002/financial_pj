schema_version: 1
id: env-doctor
name: 财务运行环境诊断
version: 1.0.0
status: disabled
category: 基础能力
description: 检查 Python、Office、LibreOffice、依赖和目录条件的 Agent 指南。
tags:
- 环境诊断
- Agent
file_inputs: []
input_schema:
  type: object
  additionalProperties: true
  properties: {}
output_schema:
  type: object
  required:
  - status
  - summary
  - output_files
  - warnings
  properties:
    status:
      const: success
    summary:
      type: object
    output_files:
      type: array
    warnings:
      type: array
handler:
  adapter: python
  entrypoint: scripts/entry.py
  worker_pool: python
runtime:
  timeout_seconds: 600
  memory_mb: 2048
  concurrency_limit: 1
  network_access: false
risk:
  level: read_only
  requires_confirmation: false
permissions:
  run: finance_user
  manage: skill_admin
upstream:
  repository: https://github.com/EvanLee2004/finance-skills
  path: skills/env-doctor
blocked_reason: 属于 Agent 行为指南，需要受控系统诊断适配器。
