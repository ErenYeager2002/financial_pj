schema_version: 1
id: withholding-report-rename
name: 代扣代缴申报表批量重命名
version: 1.0.0
status: published
category: 文件整理
description: 识别申报表 PDF 内容并生成规范命名的副本，平台不会修改上传原件。
tags:
- PDF
- 申报表
- 批量重命名
- 副本
file_inputs:
- role: reports
  name: 申报表 PDF
  description: 可一次上传多份 PDF。
  required: true
  multiple: true
  min_files: 1
  extensions:
  - pdf
  max_size_mb: 100
input_schema:
  type: object
  additionalProperties: false
  properties: {}
output_schema:
  type: object
  required:
  - status
  - summary
  - output_files
  - warnings
  properties:
    status:
      const: success
    summary:
      type: object
    output_files:
      type: array
    warnings:
      type: array
handler:
  adapter: python
  entrypoint: scripts/entry.py
  worker_pool: python
runtime:
  timeout_seconds: 600
  memory_mb: 2048
  concurrency_limit: 1
  network_access: false
risk:
  level: read_only
  requires_confirmation: false
permissions:
  run: finance_user
  manage: skill_admin
upstream:
  repository: https://github.com/EvanLee2004/finance-skills
  path: skills/withholding-report-rename
