# Financial Skill Platform database migration configuration.
#
# Migration scripts live in backend/alembic. The SQLAlchemy URL is resolved in
# backend/alembic/env.py from backend/app/settings.py so no environment
# setting or credential is stored in this file.
[alembic]
script_location = backend/alembic
prepend_sys_path = backend
path_separator = os
# Naming convention mirrors the SQLAlchemy metadata so autogenerate diffs cleanly.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = Asia/Shanghai

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
