schema_version: 1
id: labor-invoice-check
name: 劳务发票核对
version: 1.0.0
status: published
category: 发票核对
description: 按业务规则核对劳务清单与发票台账，输出支付前核对结果。
ui:
  employee_name: 劳务发票核对
  short_description: 核对劳务清单与发票台账，生成支付前差异清单。
  categories: [发票检查]
  estimated_minutes: 2
  output_summary: 核对结果和差异清单
  action_label: 开始核对
  popular: true
tags:
- Excel
- 劳务
- 发票
- 核对
operational_profile:
  execution_kind: offline_file
  external_sources: []
  employee_labels: [上传两份台账, 本地核对, 输出支付清单]
file_inputs:
- role: labor_list
  name: 劳务清单
  description: ''
  required: true
  multiple: false
  min_files: 1
  extensions:
  - xlsx
  - xls
  max_size_mb: 100
- role: invoice_ledger
  name: 发票台账
  description: ''
  required: true
  multiple: false
  min_files: 1
  extensions:
  - xlsx
  - xls
  max_size_mb: 100
input_schema:
  type: object
  additionalProperties: false
  properties: {}
output_schema:
  type: object
  required:
  - status
  - summary
  - output_files
  - warnings
  properties:
    status:
      const: success
    summary:
      type: object
    output_files:
      type: array
    warnings:
      type: array
handler:
  adapter: python
  entrypoint: scripts/entry.py
  worker_pool: python
runtime:
  timeout_seconds: 600
  memory_mb: 2048
  concurrency_limit: 1
  network_access: false
risk:
  level: read_only
  requires_confirmation: true
  requires_change_review: false
  requires_approval: false
  modifies_uploaded_files: false
safety_constraints: {}
progress_stages:
- key: reading_files
  label: 正在读取文件
- key: validating_fields
  label: 正在检查字段
- key: processing
  label: 正在核对记录
- key: generating_output
  label: 正在生成结果文件
result_presentation:
  metrics: []
permissions:
  run: finance_user
  manage: skill_admin
upstream:
  repository: https://gitee.com/Lee157/finance-skills.git
  path: skills/labor-invoice-check
