schema_version: 1
id: ar-hexiao-daily
name: 应收核销日清
version: 1.5.0
status: published
category: 应收管理
description: 应收核销多阶段流程，自动登录智云取数，按核销记录身份审计并纠正可解释的系统重复核销；日清与写前校验通过后直接安全写入副本，并按真实单元格坐标归一化公式差异。
tags:
- 应收核销
- 自动写入
- 多阶段
file_inputs:
- role: finance_workbooks
  name: 盈亏与流转表副本
  description: 至少上传盈亏核算表和到账流转表副本。
  required: true
  multiple: true
  min_files: 2
  extensions:
  - xlsx
  - xlsm
  - xls
  max_size_mb: 100
input_schema:
  type: object
  additionalProperties: false
  properties: {}
output_schema:
  type: object
  required:
  - status
  - summary
  - output_files
  - warnings
  properties:
    status:
      const: success
    summary:
      type: object
    output_files:
      type: array
    warnings:
      type: array
handler:
  adapter: workflow
  worker_pool: workflow
runtime:
  timeout_seconds: 1800
  memory_mb: 2048
  concurrency_limit: 1
  network_access: true
risk:
  level: write
  requires_confirmation: false
permissions:
  run: finance_user
  manage: skill_admin
upstream:
  repository: https://github.com/EvanLee2004/finance-skills
  path: skills/ar-hexiao-daily
