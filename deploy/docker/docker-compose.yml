x-common: &common
  image: financial-platform:20260731
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  restart: unless-stopped
  env_file:
    - ${FINANCIAL_ENV_FILE:-.env}
  volumes:
    - ./runtime/data:/var/lib/financial-platform
  networks:
    - personal-blog
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    <<: *common
    container_name: financial-platform-api
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker-python-1:
    <<: *common
    container_name: financial-platform-worker-python-1
    command: ["python", "-m", "app.worker", "--pools", "python", "--worker-id", "python-1"]

  worker-python-2:
    <<: *common
    container_name: financial-platform-worker-python-2
    command: ["python", "-m", "app.worker", "--pools", "python", "--worker-id", "python-2"]

  worker-http-1:
    <<: *common
    container_name: financial-platform-worker-http-1
    command: ["python", "-m", "app.worker", "--pools", "http", "--worker-id", "http-1"]

  worker-http-2:
    <<: *common
    container_name: financial-platform-worker-http-2
    command: ["python", "-m", "app.worker", "--pools", "http", "--worker-id", "http-2"]

  worker-workflow-1:
    <<: *common
    container_name: financial-platform-worker-workflow-1
    command: ["python", "-m", "app.worker", "--pools", "workflow", "--worker-id", "workflow-1"]

  worker-workflow-2:
    <<: *common
    container_name: financial-platform-worker-workflow-2
    command: ["python", "-m", "app.worker", "--pools", "workflow", "--worker-id", "workflow-2"]

networks:
  personal-blog:
    external: true
    name: personal-blog_default
