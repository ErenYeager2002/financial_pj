schema_version: 1
id: ar-hexiao-daily
name: 应收核销日清
version: 1.0.0
status: draft
category: 应收管理
description: 应收核销多阶段流程，包含取数、判定、人工确认、写副本和挂账重扫。
tags:
- 应收核销
- 人在环
- 多阶段
file_inputs: []
input_schema:
  type: object
  additionalProperties: true
  properties: {}
