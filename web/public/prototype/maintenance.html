"维护场景预览"><span class="caption">预览场景</span><button data-mode="notice">更新预告</button><button data-mode="updating">平台更新中</button><button data-mode="worker">任务服务更新中</button><button data-mode="unavailable">服务不可用</button></nav>
<script>
// PROTOTYPE: four maintenance states; visual-only, no API calls or service changes.
const icon='<svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 5v10M24 33v10M5 24h10M33 24h10M10.6 10.6l7.1 7.1m12.6 12.6 7.1 7.1M10.6 37.4l7.1-7.1m12.6-12.6 7.1-7.1" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="24" r="4" fill="currentColor"/></svg>';
const modes=['notice','updating','worker','unavailable'];
function screen(mode){
 const main=document.getElementById('main');document.body.dataset.mode=mode;
 document.querySelectorAll('[data-mode]').forEach(b=>{if(b.tagName==='BUTTON')b.setAttribute('aria-pressed',String(b.dataset.mode===mode));});
 if(mode==='notice'||mode==='worker'){
  const worker=mode==='worker';
  main.innerHTML='<div class="intro"><div><h1>'+ (worker?'任务服务更新中':'即将进行平台更新')+'</h1><p>页面内提示效果 · 示例内容</p></div></div><section class="shell"><div class="shellhead"><span>我的任务</span><span class="small">工作台 / 我的任务</span></div><div class="banner"><span style="color:var(--accent);font-size:23px" aria-hidden="true">'+(worker?'◷':'ⓘ')+'</span><div><b>'+(worker?'任务服务正在更新，暂时无法发起新任务':'平台即将更新，暂时停止接收新任务')+'</b><p>'+(worker?'历史任务与已有文件仍可查看。服务恢复后即可继续操作。':'已开始的任务会继续执行，完成后再进行更新。请先保存尚未提交的内容。')+'</p></div></div><div class="shellbody"><aside class="side"><div>工作台</div><div class="selected">我的任务</div><div>文件中心</div></aside><div class="content"><div class="intro"><h2>任务列表</h2><button class="btn" disabled>创建任务</button></div><div class="label">以下为页面演示，不展示实际任务数据</div><div class="row"><div>应收核销日清<div class="small">'+(worker?'已有任务记录':'已开始的任务继续执行')+'</div></div><span class="tag">'+(worker?'可查看':'处理中 · 示例')+'</span></div><div class="row"><div>历史任务<div class="small">查看处理结果与产出文件</div></div><button class="btn" data-demo="查看详情">查看详情</button></div><div class="note">'+(worker?'暂停的是新任务提交，已保存的信息仍然保留。':'正式更新开始后，页面会显示更新提示。')+'</div><p class="message" role="status"></p></div></div></section>';
 }else{
 const fault=mode==='unavailable';
 main.innerHTML='<section class="center '+(fault?'fault':'')+'"><div class="symbol">'+icon+'</div><div class="eyebrow">'+(fault?'服务连接暂时中断':'平台维护')+'</div><h1>'+(fault?'服务暂时不可用':'平台正在更新')+'</h1><p class="sub">'+(fault?'暂时无法连接平台，请稍后再试。<br>为避免重复操作，请不要反复提交任务。':'当前暂时无法操作，请稍候。<br>更新完成后，本页面会自动恢复。')+'</p><div class="panel"><div class="line"><span class="dot"></span><div><b>'+(fault?'等待服务恢复':'正在更新平台服务')+'</b><div class="small">'+(fault?'这不代表任务执行失败，恢复后请先查看任务状态。':'正在切换服务并检查运行状态。')+'</div></div></div>'+(fault?'':'<div class="steps" aria-label="更新阶段示例"><div class="step done">准备更新</div><div class="step active">更新服务</div><div class="step">恢复使用</div></div>')+'</div><button class="btn '+(fault?'primary':'')+'" data-demo="检查状态">'+(fault?'重新检查':'检查更新状态')+'</button><p class="message" role="status"></p><p class="foot">'+(fault?'连接恢复后，请确认上一次操作的结果再继续。':'无需重复登录，也无需重新提交任务。')+'</p></section>';
 }
 main.insertAdjacentHTML('beforeend','<footer>仅演示页面样式与提示文案 · 未启用维护模式</footer>');
 document.title=({notice:'更新预告',updating:'平台正在更新',worker:'任务服务更新中',unavailable:'服务暂时不可用'})[mode]+' · 预览';
 main.querySelectorAll('[data-demo]').forEach(b=>b.addEventListener('click',()=>{main.querySelector('.message').textContent='预览模式：此按钮不请求真实服务，也不会执行任务。';}));
}
function choose(mode){const u=new URL(location.href);u.searchParams.set('variant',mode);history.replaceState(null,'',u);screen(mode);}
document.querySelectorAll('.dock button').forEach(b=>b.addEventListener('click',()=>choose(b.dataset.mode)));
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const i=modes.indexOf(document.body.dataset.mode);choose(modes[(i+(e.key==='ArrowRight'?1:3))%4]);}});
const initial=new URL(location.href).searchParams.get('variant');screen(modes.includes(initial)?initial:'updating');
</script></body></html>
