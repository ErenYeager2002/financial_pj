schema_version: 1
id: compliance-spot-check
name: 合规文件抽查建议
version: 1.0.0
status: published
category: 合规检查
description: 依据应收 all 和可选历史记录生成本周合规抽查建议清单。
ui:
  employee_name: 合规文件抽查建议
  short_description: 根据应收台账和可选历史记录生成本周抽查建议。
  categories: [合规检查]
  estimated_minutes: 2
  output_summary: 合规抽查建议清单
  action_label: 生成建议
  popular: false
tags:
- Excel
- 合规
- 抽查
- 建议
file_inputs:
- role: receivables
  name: 应收 all
  description: ''
  required: true
  multiple: false
  min_files: 1
  extensions:
  - xlsx
  - xls
  max_size_mb: 100
- role: history
  name: 抽查历史
  description: ''
  required: false
  multiple: false
  min_files: 1
  extensions:
  - csv
  max_size_mb: 100
input_schema:
  type: object
  additionalProperties: false
  properties: {}
output_schema:
  type: object
  required:
  - status
  - summary
  - output_files
  - warnings
  properties:
    status:
      const: success
    summary:
      type: object
    output_files:
      type: array
    warnings:
      type: array
handler:
  adapter: python
  entrypoint: scripts/entry.py
  worker_pool: python
runtime:
  timeout_seconds: 600
  memory_mb: 2048
  concurrency_limit: 1
  network_access: false
risk:
  level: read_only
  requires_confirmation: true
  requires_change_review: false
  requires_approval: false
  modifies_uploaded_files: false
safety_constraints: {}
progress_stages:
- key: reading_files
  label: 正在读取文件
- key: validating_fields
  label: 正在检查字段
- key: processing
  label: 正在生成抽查建议
- key: generating_output
  label: 正在生成结果文件
result_presentation:
  metrics: []
permissions:
  run: finance_user
  manage: skill_admin
upstream:
  repository: https://github.com/EvanLee2004/finance-skills
  path: skills/compliance-spot-check
