name: 九点下单统计（离线）
command: vendor/scripts/run.py
arguments:
- kind: file
  role: orders
  flag: --from-xlsx
- kind: parameter
  name: today
  flag: --today
- kind: parameter
  name: include_detail
  flag: --detail
  boolean: true
- kind: parameter
  name: no_date_filter
  flag: --no-date-filter
  boolean: true
output:
  type: directory
  flag: --out
  path: 下单统计结果
  archive: true
  archive_name: 九点下单统计结果.zip
success_message: 九点下单统计结果已经打包。
